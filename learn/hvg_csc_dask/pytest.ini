[pytest]
# Minimal config so this tutorial suite does NOT inherit scanpy's own addopts
# (--doctest-modules / --pyargs / plugin machinery), which would try to import
# the whole scanpy test plugin and collect doctests from our helper modules.
addopts = -ra
testpaths = .
python_files = test_*.py
markers =
    slow: longer LocalCluster / large-matrix runs (Lesson 7)
    internet: requires network download (Lesson 7B 10x 68k)
